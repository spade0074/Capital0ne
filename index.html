<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Northwind Bank — Security Awareness </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            overflow: hidden;
        }
        .page {
            padding: 2rem 1.8rem 2.2rem;
        }

        /* ---------- SIMULATION RIBBON (always visible) ---------- */
        .sim-ribbon {
            background: repeating-linear-gradient(
                45deg,
                #ffb703,
                #ffb703 10px,
                #1a2c3e 10px,
                #1a2c3e 20px
            );
            color: #fff;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 0.45rem 0.5rem;
            text-shadow: 0 0 4px #000;
        }

        /* ---------- LOGIN ---------- */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .bank-wordmark {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b5c3f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo-sub {
            font-size: 0.7rem;
            color: #5a6e8a;
            border-left: 2px solid #0b5c3f;
            padding-left: 0.6rem;
            margin: 0.4rem 0 1.5rem 0.2rem;
        }
        .input-group {
            margin-bottom: 1.4rem;
            position: relative;
        }
        label {
            display: block;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #1f2a44;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 16px;
            border: 1px solid #d0d7de;
            background: #fff;
            font-size: 0.95rem;
            outline: none;
            color: #1a2c3e;
            transition: 0.15s;
        }
        input:focus {
            border-color: #0b5c3f;
            box-shadow: 0 0 0 3px rgba(11, 92, 63, 0.1);
        }
        input.error {
            border-color: #c2412c;
            box-shadow: 0 0 0 3px rgba(194, 65, 44, 0.12);
        }
        button {
            background: #0b5c3f;
            color: white;
            border: none;
            padding: 0.85rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #084a32;
            transform: translateY(-1px);
        }
        .note-text {
            font-size: 0.7rem;
            color: #6c7a91;
            margin-top: 1.2rem;
            text-align: center;
            border-top: 1px solid #e6edf2;
            padding-top: 1.2rem;
        }
        .demo-hint {
            font-size: 0.7rem;
            color: #0b5c3f;
            background: #e8f5ef;
            border-radius: 12px;
            padding: 0.7rem 0.9rem;
            margin-bottom: 1.2rem;
            border-left: 3px solid #0b5c3f;
            line-height: 1.5;
        }
        .error-msg {
            display: none;
            font-size: 0.72rem;
            color: #c2412c;
            background: #fdecea;
            border-left: 3px solid #c2412c;
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        .error-msg.show { display: block; }

        /* ---------- DASHBOARD ---------- */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e6edf2;
        }
        .greeting-text {
            font-size: 0.9rem;
            color: #1f2a44;
            font-weight: 500;
        }
        .logout-btn {
            background: #f0f4f8;
            color: #2c3e50;
            width: auto;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0;
        }
        .logout-btn:hover {
            background: #e2e8f0;
            transform: none;
        }
        .balance-card {
            background: linear-gradient(135deg, #0b5c3f 0%, #06402b 100%);
            border-radius: 28px;
            padding: 1.5rem;
            color: white;
            margin: 1rem 0 1.5rem 0;
            box-shadow: 0 8px 20px rgba(11, 92, 63, 0.2);
        }
        .balance-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 0.4rem;
        }
        .balance-amount {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .account-number {
            font-family: monospace;
            background: rgba(255,255,255,0.15);
            display: inline-block;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            margin-top: 0.9rem;
        }
        .transfer-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.2rem;
            margin: 1rem 0;
            border: 1px solid #e2e8f0;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #eef3f8;
        }
        .transaction-desc {
            font-weight: 500;
            font-size: 0.85rem;
            color: #1a2c3e;
        }
        .transaction-date {
            font-size: 0.65rem;
            color: #8b9ab0;
            margin-top: 0.2rem;
        }
        .transaction-amount {
            font-weight: 700;
            color: #c2412c;
            font-size: 0.9rem;
        }
        .transaction-amount.positive { color: #2b6e3c; }

        /* ---------- FREEZE OVERLAY ---------- */
        .overlay-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 30, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .overlay-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        .freeze-panel {
            background: #ffffff;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            padding: 1.8rem 1.6rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            transform: scale(0.92);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-top: 8px solid #c2412c;
        }
        .overlay-backdrop.show .freeze-panel {
            transform: scale(1);
        }
        .freeze-sim-badge {
            display: inline-block;
            background: #1a2c3e;
            color: #ffb703;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            margin-bottom: 1rem;
        }
        .freeze-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fdecea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.8rem;
        }
        .freeze-panel h2 {
            color: #c2412c;
            font-size: 1.3rem;
            margin-bottom: 0.6rem;
        }
        .freeze-panel p {
            color: #4a5a70;
            font-size: 0.85rem;
            line-height: 1.55;
            margin-bottom: 0.8rem;
        }
        .freeze-panel .sim-note {
            background: #fff8e6;
            border-left: 3px solid #ffb703;
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
            font-size: 0.72rem;
            color: #6b5200;
            text-align: left;
            margin: 1rem 0;
            line-height: 1.5;
        }
        .reset-btn {
            background: #1a2c3e;
            margin-top: 0.3rem;
        }
        .reset-btn:hover { background: #0f1a2a; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sim-ribbon">⚠      System Maintenance: Some services may be temporarily unavailable.⚠</div>
    <div id="appRoot"></div>
</div>

<script>
    // ============================================================
    //  NORTHWIND BANK — SECURITY AWARENESS 
    //  - Only the correct credentials will "log in"
    //  - All data is fake and lives only in this page's memory
    // ============================================================

    // ✅ The only valid credentials
    const VALID_USERNAME = "GNF047";
    const VALID_PASSWORD = "220087";

    const FAKE_ACCOUNT = {
        name: "Jordan Avery",
        mask: "****4821",
        balance: 12480.55,
        transactions: [
            { desc: "Grocery Store", amount: -86.20, date: "Mar 3, 2026" },
            { desc: "Payroll Deposit", amount: 2450.00, date: "Mar 1, 2026" },
            { desc: "Streaming Service", amount: -14.99, date: "Feb 28, 2026" },
            { desc: "Coffee Shop", amount: -5.75, date: "Feb 27, 2026" },
            { desc: "Electric Bill", amount: -112.40, date: "Feb 25, 2026" }
        ]
    };

    let freezeTimer = null;

    function render() {
        const root = document.getElementById('appRoot');
        if (!root) return;
        root.innerHTML = `
            <div class="page">
                <div class="logo-container">
                    <div class="bank-wordmark">Northwind Bank</div>
                </div>
                <div class="logo-sub">Security Awareness </div>

                <div class="demo-hint">
                    <strong>Welcome bank:</strong> We’re happy to have you with us. Manage your money securely and conveniently, anytime, anywhere. Thank you for banking with us..
                </div>

                <div class="error-msg" id="loginError">
                    Incorrect username or password. Please try again.
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="6-digit code" inputmode="numeric" maxlength="6">
                </div>
                <button id="loginBtn">Sign in </button>

                <div class="note-text">
                    Please log in with the credentials you have been provided.
                </div>
            </div>
        `;
        attachLoginEvents();
    }

    function attachLoginEvents() {
        const btn = document.getElementById('loginBtn');
        const userInput = document.getElementById('username');
        const passInput = document.getElementById('password');
        const errorBox = document.getElementById('loginError');

        const attempt = () => {
            const u = (userInput?.value || "").trim();
            const p = (passInput?.value || "").trim();

            // Clear previous error state
            errorBox?.classList.remove('show');
            userInput?.classList.remove('error');
            passInput?.classList.remove('error');

            if (u === VALID_USERNAME && p === VALID_PASSWORD) {
                renderDashboard();
            } else {
                errorBox?.classList.add('show');
                userInput?.classList.add('error');
                passInput?.classList.add('error');
                passInput && (passInput.value = "");
            }
        };

        btn?.addEventListener('click', attempt);
        [userInput, passInput].forEach(inp =>
            inp?.addEventListener('keypress', e => {
                if (e.key === 'Enter') attempt();
            })
        );
    }

    function renderDashboard() {
        const root = document.getElementById('appRoot');
        const a = FAKE_ACCOUNT;
        root.innerHTML = `
            <div class="page" id="dashboardPage">
                <div class="dashboard-header">
                    <div class="greeting-text">Welcome back, ${a.name}</div>
                    <button class="logout-btn" id="logoutBtn">Log out</button>
                </div>

                <div class="balance-card">
                    <div class="balance-label">Total Balance (USD)</div>
                    <div class="balance-amount">$${a.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                    <div class="account-number">Account ${a.mask}</div>
                </div>

                <div class="transfer-card">
                    <div style="font-weight:600;margin-bottom:0.3rem;color:#1a2c3e;">Bank transfer</div>
                    <p style="font-size:0.8rem;color:#5a6e8a;margin-bottom:1rem;">
                        Send money securely to another bank account.
                    </p>
                    <button id="transferBtn" disabled style="opacity:0.6;cursor:not-allowed;">
                        Transfer funds (Account frozen)
                    </button>
                </div>

                <div>
                    <div style="font-weight:600;margin-bottom:0.8rem;font-size:0.8rem;color:#1a2c3e;">
                        Recent transactions
                    </div>
                    ${a.transactions.map(tx => `
                        <div class="transaction-item">
                            <div>
                                <div class="transaction-desc">${tx.desc}</div>
                                <div class="transaction-date">${tx.date}</div>
                            </div>
                            <div class="transaction-amount ${tx.amount > 0 ? 'positive' : ''}">
                                ${tx.amount > 0 ? '+' : '-'}$${Math.abs(tx.amount).toFixed(2)}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>

            <!-- Freeze overlay (hidden until 5s) -->
            <div class="overlay-backdrop" id="freezeOverlay">
                <div class="freeze-panel">
                    <div class="freeze-sim-badge">FROZEN</div>
                    <div class="freeze-icon">🔒</div>
                    <h2>Account Frozen</h2>
                    <p>
                        Your account has been temporarily frozen due to suspected
                        unauthorized activity. All transactions and transfers are
                        currently disabled.
                    </p>
                    <div class="sim-note">
                        <strong>⚠️ Account Restricted:</strong> Your account has been temporarily restricted due to a security review. Some transactions and account services may be unavailable until the review is completed. 
                    </div>
                    <button class="reset-btn" id="resetDemoBtn">Log out</button>
                </div>
            </div>
        `;

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            clearTimeout(freezeTimer);
            render();
        });

        // "Log out" on the freeze overlay → straight back to login
        document.getElementById('resetDemoBtn')?.addEventListener('click', () => {
            clearTimeout(freezeTimer);
            render();
        });

        // After 5 seconds, blur the dashboard and reveal the freeze overlay
        freezeTimer = setTimeout(() => {
            const overlay = document.getElementById('freezeOverlay');
            if (overlay) overlay.classList.add('show');
        }, 5000);
    }

    render();
</script>
</body>
</html>
