<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Northwind Bank — Security Awareness Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
            overflow: hidden;
        }
        .page {
            padding: 2rem 1.8rem 2.2rem;
        }

        /* ---------- SIMULATION RIBBON (always visible) ---------- */
        .sim-ribbon {
            background: repeating-linear-gradient(
                45deg,
                #ffb703,
                #ffb703 10px,
                #1a2c3e 10px,
                #1a2c3e 20px
            );
            color: #fff;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 0.45rem 0.5rem;
            text-shadow: 0 0 4px #000;
        }

        /* ---------- LOGIN ---------- */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .bank-wordmark {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b5c3f;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .logo-sub {
            font-size: 0.7rem;
            color: #5a6e8a;
            border-left: 2px solid #0b5c3f;
            padding-left: 0.6rem;
            margin: 0.4rem 0 1.5rem 0.2rem;
        }
        .input-group {
            margin-bottom: 1.4rem;
            position: relative;
        }
        label {
            display: block;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #1f2a44;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 16px;
            border: 1px solid #d0d7de;
            background: #fff;
            font-size: 0.95rem;
            outline: none;
            color: #1a2c3e;
            transition: 0.15s;
        }
        input:focus {
            border-color: #0b5c3f;
            box-shadow: 0 0 0 3px rgba(11, 92, 63, 0.1);
        }
        button {
            background: #0b5c3f;
            color: white;
            border: none;
            padding: 0.85rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #084a32;
            transform: translateY(-1px);
        }
        .note-text {
            font-size: 0.7rem;
            color: #6c7a91;
            margin-top: 1.2rem;
            text-align: center;
            border-top: 1px solid #e6edf2;
            padding-top: 1.2rem;
        }
        .demo-hint {
            font-size: 0.7rem;
            color: #0b5c3f;
            background: #e8f5ef;
            border-radius: 12px;
            padding: 0.7rem 0.9rem;
            margin-bottom: 1.2rem;
            border-left: 3px solid #0b5c3f;
            line-height: 1.5;
        }

        /* ---------- DASHBOARD ---------- */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e6edf2;
        }
        .greeting-text {
            font-size: 0.9rem;
            color: #1f2a44;
            font-weight: 500;
        }
        .logout-btn {
            background: #f0f4f8;
            color: #2c3e50;
            width: auto;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0;
        }
        .logout-btn:hover {
            background: #e2e8f0;
            transform: none;
        }
        .balance-card {
            background: linear-gradient(135deg, #0b5c3f 0%, #06402b 100%);
            border-radius: 28px;
            padding: 1.5rem;
            color: white;
            margin: 1rem 0 1.5rem 0;
            box-shadow: 0 8px 20px rgba(11, 92, 63, 0.2);
        }
        .balance-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 0.4rem;
        }
        .balance-amount {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .account-number {
            font-family: monospace;
            background: rgba(255,255,255,0.15);
            display: inline-block;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            margin-top: 0.9rem;
        }
        .transfer-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.2rem;
            margin: 1rem 0;
            border: 1px solid #e2e8f0;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #eef3f8;
        }
        .transaction-desc {
            font-weight: 500;
            font-size: 0.85rem;
            color: #1a2c3e;
        }
        .transaction-date {
            font-size: 0.65rem;
            color: #8b9ab0;
            margin-top: 0.2rem;
        }
        .transaction-amount {
            font-weight: 700;
            color: #c2412c;
            font-size: 0.9rem;
        }
        .transaction-amount.positive { color: #2b6e3c; }

        /* ---------- FREEZE OVERLAY ---------- */
        .overlay-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 30, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .overlay-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }
        .freeze-panel {
            background: #ffffff;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            padding: 1.8rem 1.6rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            transform: scale(0.92);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-top: 8px solid #c2412c;
        }
        .overlay-backdrop.show .freeze-panel {
            transform: scale(1);
        }
        .freeze-sim-badge {
            display: inline-block;
            background: #1a2c3e;
            color: #ffb703;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            margin-bottom: 1rem;
        }
        .freeze-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fdecea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.8rem;
        }
        .freeze-panel h2 {
            color: #c2412c;
            font-size: 1.3rem;
            margin-bottom: 0.6rem;
        }
        .freeze-panel p {
            color: #4a5a70;
            font-size: 0.85rem;
            line-height: 1.55;
            margin-bottom: 0.8rem;
        }
        .freeze-panel .sim-note {
            background: #fff8e6;
            border-left: 3px solid #ffb703;
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
            font-size: 0.72rem;
            color: #6b5200;
            text-align: left;
            margin: 1rem 0;
            line-height: 1.5;
        }
        .reset-btn {
            background: #1a2c3e;
            margin-top: 0.3rem;
        }
        .reset-btn:hover { background: #0f1a2a; }

        /* ---------- DEBRIEF PANEL ---------- */
        .debrief {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 1.8rem 1.6rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .debrief h2 {
            color: #1a2c3e;
            font-size: 1.25rem;
            margin-bottom: 0.4rem;
        }
        .debrief .sub {
            font-size: 0.78rem;
            color: #6c7a91;
            margin-bottom: 1.2rem;
        }
        .debrief ul {
            list-style: none;
            margin-bottom: 1.3rem;
        }
        .debrief li {
            font-size: 0.82rem;
            color: #2c3e50;
            line-height: 1.5;
            padding: 0.6rem 0 0.6rem 1.8rem;
            position: relative;
            border-bottom: 1px solid #eef3f8;
        }
        .debrief li::before {
            content: "⚠️";
            position: absolute;
            left: 0;
            top: 0.55rem;
            font-size: 0.9rem;
        }
        .debrief li:last-child { border-bottom: none; }
        .debrief .closing {
            font-size: 0.78rem;
            color: #0b5c3f;
            background: #e8f5ef;
            border-radius: 12px;
            padding: 0.8rem 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sim-ribbon">⚠ SIMULATION — NOT A REAL BANK — FOR SECURITY AWARENESS TRAINING ONLY ⚠</div>
    <div id="appRoot"></div>
</div>

<script>
    // ============================================================
    //  NORTHWIND BANK — SECURITY AWARENESS DEMO
    //  - No real credentials are checked or stored
    //  - Any username/password "logs in"
    //  - All data is fake and lives only in this page's memory
    // ============================================================

    const FAKE_ACCOUNT = {
        name: "Jordan Avery",
        mask: "****4821",
        balance: 12480.55,
        transactions: [
            { desc: "Grocery Store", amount: -86.20, date: "Mar 3, 2026" },
            { desc: "Payroll Deposit", amount: 2450.00, date: "Mar 1, 2026" },
            { desc: "Streaming Service", amount: -14.99, date: "Feb 28, 2026" },
            { desc: "Coffee Shop", amount: -5.75, date: "Feb 27, 2026" },
            { desc: "Electric Bill", amount: -112.40, date: "Feb 25, 2026" }
        ]
    };

    let freezeTimer = null;

    function showToast(msg) {
        const existing = document.querySelector('.toast-message');
        if (existing) existing.remove();
        const t = document.createElement('div');
        t.className = 'toast-message';
        t.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1a2c3e;color:#fff;padding:0.75rem 1.5rem;border-radius:40px;font-size:0.85rem;z-index:10000;font-weight:500;';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    function render() {
        const root = document.getElementById('appRoot');
        if (!root) return;
        root.innerHTML = `
            <div class="page">
                <div class="logo-container">
                    <div class="bank-wordmark">Northwind Bank</div>
                </div>
                <div class="logo-sub">Security Awareness Demo</div>

                <div class="demo-hint">
                    <strong>How this works:</strong> enter anything below to "log in."
                    No credentials are checked or sent anywhere. Five seconds after the
                    dashboard loads, a simulated "account frozen" screen will appear.
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Anything works" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Anything works">
                </div>
                <button id="loginBtn">Sign in (demo)</button>

                <div class="note-text">
                    This is a training simulation. No data leaves your browser.
                </div>
            </div>
        `;
        attachLoginEvents();
    }

    function attachLoginEvents() {
        const btn = document.getElementById('loginBtn');
        const attempt = () => {
            renderDashboard();
        };
        btn?.addEventListener('click', attempt);
        [document.getElementById('username'), document.getElementById('password')]
            .forEach(inp => inp?.addEventListener('keypress', e => {
                if (e.key === 'Enter') attempt();
            }));
    }

    function renderDashboard() {
        const root = document.getElementById('appRoot');
        const a = FAKE_ACCOUNT;
        root.innerHTML = `
            <div class="page" id="dashboardPage">
                <div class="dashboard-header">
                    <div class="greeting-text">Welcome back, ${a.name}</div>
                    <button class="logout-btn" id="logoutBtn">Log out</button>
                </div>

                <div class="balance-card">
                    <div class="balance-label">Total Balance (USD)</div>
                    <div class="balance-amount">$${a.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                    <div class="account-number">Account ${a.mask}</div>
                </div>

                <div class="transfer-card">
                    <div style="font-weight:600;margin-bottom:0.3rem;color:#1a2c3e;">Bank transfer</div>
                    <p style="font-size:0.8rem;color:#5a6e8a;margin-bottom:1rem;">
                        Send money securely to another bank account.
                    </p>
                    <button id="transferBtn" disabled style="opacity:0.6;cursor:not-allowed;">
                        Transfer funds (locked in demo)
                    </button>
                </div>

                <div>
                    <div style="font-weight:600;margin-bottom:0.8rem;font-size:0.8rem;color:#1a2c3e;">
                        Recent transactions
                    </div>
                    ${a.transactions.map(tx => `
                        <div class="transaction-item">
                            <div>
                                <div class="transaction-desc">${tx.desc}</div>
                                <div class="transaction-date">${tx.date}</div>
                            </div>
                            <div class="transaction-amount ${tx.amount > 0 ? 'positive' : ''}">
                                ${tx.amount > 0 ? '+' : '-'}$${Math.abs(tx.amount).toFixed(2)}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>

            <!-- Freeze overlay (hidden until 5s) -->
            <div class="overlay-backdrop" id="freezeOverlay">
                <div class="freeze-panel">
                    <div class="freeze-sim-badge">SIMULATION</div>
                    <div class="freeze-icon">🔒</div>
                    <h2>Account Frozen</h2>
                    <p>
                        Your account has been temporarily frozen due to suspected
                        unauthorized activity. All transactions and transfers are
                        currently disabled.
                    </p>
                    <div class="sim-note">
                        <strong>This is the lesson:</strong> a real bank freeze would
                        never appear as an unexplained pop-up with no recovery path.
                        Real banks tell you <em>why</em>, give you a phone number or
                        in-app support option, and never ask you to "verify" your
                        password, PIN, or one-time codes on a page you reached from
                        a link or pop-up.
                    </div>
                    <button class="reset-btn" id="resetDemoBtn">Reset demo</button>
                </div>
            </div>
        `;

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            clearTimeout(freezeTimer);
            render();
        });

        document.getElementById('resetDemoBtn')?.addEventListener('click', () => {
            clearTimeout(freezeTimer);
            showDebrief();
        });

        // After 5 seconds, blur the dashboard and reveal the freeze overlay
        freezeTimer = setTimeout(() => {
            const overlay = document.getElementById('freezeOverlay');
            if (overlay) overlay.classList.add('show');
        }, 5000);
    }

    function showDebrief() {
        const root = document.getElementById('appRoot');
        root.innerHTML = `
            <div style="position:fixed;inset:0;background:rgba(10,20,30,0.6);
                        backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
                        display:flex;align-items:center;justify-content:center;
                        padding:1.5rem;z-index:9500;">
                <div class="debrief">
                    <h2>What just happened?</h2>
                    <div class="sub">You were shown a simulated bank-freeze screen.</div>

                    <ul>
                        <li>The login accepted <em>any</em> input — real banks never do.</li>
                        <li>You saw a plausible dashboard, then an unexplained freeze.</li>
                        <li>The freeze blocked every action with no way to recover.</li>
                        <li>The pattern is designed to make you panic and "act fast."</li>
                    </ul>

                    <div class="closing">
                        <strong>Red flags to remember:</strong> urgency, a sudden lockout
                        with no explanation, a request to "verify" your password/PIN/OTP,
                        and any page you reached from a link or pop-up instead of opening
                        your bank's app or typing the address yourself.
                    </div>

                    <button id="startOverBtn">Start over</button>
                </div>
            </div>
        `;
        document.getElementById('startOverBtn')?.addEventListener('click', render);
    }

    render();
</script>
</body>
</html>
